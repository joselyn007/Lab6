openapi: 3.0.3
info:
  title: API de Gestión de Hotel
  description: API RESTful para administrar reservas de un hotel.
  version: 1.0.0
paths:
  /api/v1/reservas:
    post:
      summary: Crear una reserva
      operationId: crearHotel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HotelRequest'
      responses:
        '201':
          description: Reserva creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hotel'
        '400':
          description: Solicitud incorrecta o datos inválidos

    get:
      summary: Consultar todas las reservas
      operationId: consultarHotel
      responses:
        '200':
          description: Lista de reservas obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Hotel'

  /api/v1/reservas/{id}:
    get:
      summary: Consultar reserva por ID
      operationId: consultarHotelPorId
      parameters:
        - name: id
          in: path
          required: true
          description: ID de la reserva a buscar
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Reserva encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hotel'
        '404':
          description: Reserva no encontrada

    put:
      summary: Actualizar una reserva existente
      operationId: actualizarHotel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HotelRequest'
      responses:
        '200':
          description: Reserva actualizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hotel'
        '400':
          description: Datos de entrada inválidos
        '404':
          description: Reserva no encontrada

    delete:
      summary: Eliminar una reserva
      operationId: eliminarHotel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Reserva eliminada exitosamente
        '404':
          description: Reserva no encontrada

components:
  schemas:
    Hotel:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nomCliente:
          type: string
          example: "Juan Gomez"
        habitacion:
          type: string
          example: "habitacion 112"
        fechEntrada:
          type: string
          example: "18 de junio del 2024"
        fechSalida:
          type: string
          example: "25 de junio del 2024"
        estado:
          type: string
          example: "ACTIVO"

    HotelRequest:
      type: object
      required:
        - nomCliente
        - habitacion
        - fechEntrada
        - fechSalida
        - estado
      properties:
        nomCliente:
          type: string
          example: "Juan Gomez"
        habitacion:
          type: string
          example: "habitacion 112"
        fechEntrada:
          type: string
          example: "18 de junio del 2024"
        fechSalida:
          type: string
          example: "25 de junio del 2024"
        estado:
          type: string
          example: "ACTIVO"