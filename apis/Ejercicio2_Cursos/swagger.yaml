openapi: 3.0.3
info:
  title: API de Gestión de Cursos Universitarios
  description: API RESTful para la administración de cursos universitarios.
  version: 1.0.0
paths:
  /api/v1/cursos:
    post:
      summary: Crear un nuevo curso
      operationId: crearCurso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CursosRequest'
      responses:
        '201':
          description: Curso creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cursos'
        '400':
          description: Solicitud incorrecta o datos inválidos

    get:
      summary: Consultar todos los cursos
      operationId: consultarCursos
      responses:
        '200':
          description: Lista de cursos obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cursos'

  /api/v1/cursos/buscar:
    get:
      summary: Consultar curso por código
      operationId: consultarCursoPorCodigo
      parameters:
        - name: codigo
          in: query
          required: true
          description: Código del curso a buscar
          schema:
            type: string
      responses:
        '200':
          description: Curso encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cursos'
        '404':
          description: Curso no encontrado

  /api/v1/cursos/{id}:
    put:
      summary: Actualizar un curso existente
      operationId: actualizarCurso
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CursosRequest'
      responses:
        '200':
          description: Curso actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cursos'
        '400':
          description: Datos de entrada inválidos
        '404':
          description: Curso no encontrado

    delete:
      summary: Eliminar un curso
      operationId: eliminarCurso
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Curso eliminado exitosamente
        '404':
          description: Curso no encontrado

components:
  schemas:
    Cursos:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nombre:
          type: string
          example: "Programación I"
        codigo:
          type: string
          example: "PRG-101"
        creditos:
          type: integer
          example: 4
        estado:
          type: string
          example: "ACTIVO"

    CursosRequest:
      type: object
      required:
        - nombre
        - codigo
        - creditos
        - estado
      properties:
        nombre:
          type: string
          example: "Programación I"
        codigo:
          type: string
          example: "PRG-101"
        creditos:
          type: integer
          example: 4
        estado:
          type: string
          example: "ACTIVO"